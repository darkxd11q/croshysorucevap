<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Bilgi Yarışması</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans flex items-center justify-center min-h-screen p-4">

    <!-- GİRİŞ EKRANI -->
    <div id="girisEkrani" class="bg-gray-900 p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-md text-center transition-all">
        <h2 class="text-3xl font-extrabold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500">Oyuna Katıl</h2>
        <input type="text" id="isim" placeholder="Twitch Nickin veya Adın" class="w-full bg-gray-800 p-4 rounded-lg mb-4 text-center text-lg outline-none focus:ring-2 focus:ring-purple-500 border border-gray-700">
        <button onclick="beklemeEkraninaGec()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 transition p-4 rounded-lg font-bold text-lg shadow-lg">Bağlan</button>
    </div>

    <!-- SORU EKRANI -->
    <div id="soruEkrani" class="hidden bg-gray-900 p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-2xl text-center">
        <div id="beklemeMetni" class="animate-pulse">
            <h2 class="text-2xl font-bold text-gray-400">Yayıncının soruyu göndermesi bekleniyor...</h2>
        </div>

        <div id="aktifSoruAlani" class="hidden">
            <div class="inline-block bg-green-900 text-green-400 px-4 py-1 rounded-full text-sm font-bold mb-4 border border-green-700">Ödül: <span id="gelenFiyat">0</span> TL</div>
            <h3 id="gelenSoru" class="text-3xl font-bold mb-8 text-white">Soru buraya gelecek</h3>
            <div id="butonlar" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Şıklar buraya JS ile eklenecek -->
            </div>
            <p id="durumMesaji" class="mt-6 text-yellow-400 font-semibold h-6"></p>
        </div>
    </div>

    <script>
        const socket = io();
        let secilenButon = null;

        function beklemeEkraninaGec() {
            if(!document.getElementById('isim').value) return alert("Lütfen bir isim gir!");
            document.getElementById('girisEkrani').classList.add('hidden');
            document.getElementById('soruEkrani').classList.remove('hidden');
        }

        socket.on('izleyiciye_soru_goster', (data) => {
            document.getElementById('beklemeMetni').classList.add('hidden');
            document.getElementById('aktifSoruAlani').classList.remove('hidden');
            
            document.getElementById('gelenSoru').innerText = data.soru;
            document.getElementById('gelenFiyat').innerText = data.fiyat;
            document.getElementById('durumMesaji').innerText = '';
            secilenButon = null;
            
            const butonlarDiv = document.getElementById('butonlar');
            butonlarDiv.innerHTML = ''; 

            data.siklar.forEach((sik, index) => {
                const btn = document.createElement('button');
                btn.innerText = sik;
                btn.className = "sik-buton bg-gray-800 hover:bg-gray-700 border border-gray-600 transition p-5 rounded-xl font-bold text-lg shadow";
                btn.onclick = () => cevapGonder(sik, index, btn);
                butonlarDiv.appendChild(btn);
            });
        });

        function cevapGonder(secilenCevap, index, btn) {
            if(secilenButon) return; // Zaten cevap verdiyse engelle
            
            secilenButon = btn;
            const isim = document.getElementById('isim').value;
            
            // Cevabı sunucuya gönder
            socket.emit('izleyici_cevap_gonder', { isim, cevap: secilenCevap });
            
            // Tüm butonları pasif yap
            document.querySelectorAll('.sik-buton').forEach(b => {
                b.classList.remove('hover:bg-gray-700');
                b.style.opacity = '0.5';
                b.onclick = null;
            });
            
            // Seçilen butonu belli et
            btn.style.opacity = '1';
            btn.classList.add('ring-2', 'ring-blue-500');
            
            document.getElementById('durumMesaji').innerText = "Cevabın iletildi! Sonuç bekleniyor...";
        }

        socket.on('izleyiciye_cevabi_goster', (dogruCevapIndex) => {
            const butonlar = document.querySelectorAll('.sik-buton');
            
            butonlar.forEach((b, index) => {
                if(index === dogruCevapIndex) {
                    b.classList.remove('bg-gray-800', 'border-gray-600');
                    b.classList.add('bg-green-600', 'border-green-400', 'text-white', 'shadow-[0_0_15px_rgba(34,197,94,0.5)]');
                    b.style.opacity = '1';
                } else if(b === secilenButon) { // Yanlış seçilen buton
                    b.classList.remove('bg-gray-800');
                    b.classList.add('bg-red-600', 'border-red-400');
                }
            });

            if(secilenButon === butonlar[dogruCevapIndex]) {
                document.getElementById('durumMesaji').innerHTML = "<span class='text-green-400 text-xl'>Tebrikler, doğru bildin! 🎉</span>";
            } else {
                document.getElementById('durumMesaji').innerHTML = "<span class='text-red-400 text-xl'>Maalesef yanlış cevap. 😔</span>";
            }
        });
    </script>
</body>
</html>
